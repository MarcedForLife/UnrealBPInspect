name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version-bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Prepare version files
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          manifest = pathlib.Path('Cargo.toml')
          current = tomllib.loads(manifest.read_text())['package']['version']
          major, minor, patch = map(int, current.split('.'))
          bump = os.environ['BUMP']
          if bump == 'major':
              major, minor, patch = major + 1, 0, 0
          elif bump == 'minor':
              minor, patch = minor + 1, 0
          elif bump == 'patch':
              patch += 1
          else:
              raise ValueError(f'Unknown bump: {bump}')
          version = f'{major}.{minor}.{patch}'
          manifest.write_text(re.sub(r'^version = ".*"$', f'version = "{version}"', manifest.read_text(), count=1, flags=re.M))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag=v{version}\n')
          PY
          cargo check

      - uses: actions/upload-artifact@v7
        with:
          name: version-bump
          path: |
            Cargo.toml
            Cargo.lock

  build:
    needs: version-bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: bp-inspect-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: bp-inspect-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: bp-inspect-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: bp-inspect-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: version-bump
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Test installers
        env:
          BP_INSPECT_TEST_BINARY: target/${{ matrix.target }}/release/bp-inspect${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python tests/installers.py
      - name: Stage binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          BINARY_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cp "target/$TARGET/release/bp-inspect$BINARY_SUFFIX" "$ARTIFACT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [version-bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version-bump.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum bp-inspect-* > checksums.txt
      - name: Commit and tag validated binaries
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::main changed during the build. Run Release again."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "Bump version to $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Upload and publish release
        run: |
          gh release create "$TAG" bp-inspect-* checksums.txt --verify-tag --draft --generate-notes --title "$TAG"
          gh release edit "$TAG" --draft=false
